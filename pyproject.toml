[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aspectbench"
version = "0.1.0.dev0"
description = "Reusable document-level aspect-based sentiment analysis tools"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Nishan Chatterjee"},
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "nbformat>=5.9",
]
notebooks = [
  "ipykernel>=6.25",
  "pandas>=2.0",
]
models = [
  "torch>=2.2",
  "transformers>=4.45",
  "sentence-transformers>=3.0",
]
dspy = [
  "dspy>=3.2",
]

[project.scripts]
aspectbench = "aspectbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
